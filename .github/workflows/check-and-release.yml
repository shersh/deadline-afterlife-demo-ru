name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build offline Windows package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          & ./tools/build_release.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish ZIP and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "dist/DEADLINE-RU-v$version-windows-x64.zip"
          gh release create $env:RELEASE_TAG $archive dist/SHA256SUMS.txt --verify-tag --title "Русский перевод DEADLINE Demo v$version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
